<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YoungMerit — Verification Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --cream:#F5F0E8;--dark:#1A1208;--brown:#3D2B0F;--amber:#C4861A;
  --amber-light:#E8A83A;--stone:#8A7560;--stone-light:#D4C9B8;
  --white:#FDFAF5;--card:#EDE8DE;--green:#3A6B3A;--green-light:#E8F0E8;
  --red:#B23A3A;--red-light:#F5E8E8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--cream);color:var(--dark);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:#0E0906;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;padding:0 32px;height:64px;gap:20px;}
.logo{font-family:'Archivo Black',sans-serif;font-size:26px;letter-spacing:0.5px;color:var(--cream);text-decoration:none;flex-shrink:0;}
.logo span{color:var(--cream);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.back-link{color:var(--stone-light);text-decoration:none;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;}
.back-link:hover{color:var(--cream);}

.page-wrap{max-width:920px;margin:0 auto;padding:110px 24px 60px;}
.page-title{font-family:'Archivo Black',sans-serif;font-size:32px;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--stone);margin-bottom:32px;}

.gate-msg{text-align:center;padding:100px 20px;color:var(--stone);}

.queue-list{display:flex;flex-direction:column;gap:12px;}
.queue-row{background:var(--white);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(26,18,8,0.05);cursor:pointer;transition:box-shadow 0.15s;}
.queue-row:hover{box-shadow:0 8px 24px rgba(26,18,8,0.1);}
.queue-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--amber),#7A5000);color:var(--dark);display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:16px;flex-shrink:0;}
.queue-info{flex:1;min-width:0;}
.queue-name{font-weight:700;font-size:15px;color:var(--dark);}
.queue-meta{font-size:12.5px;color:var(--stone);margin-top:2px;}
.queue-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;flex-shrink:0;}
.queue-badge.pending{background:#FCEFD8;color:var(--amber);}
.empty-state{text-align:center;padding:70px 20px;color:var(--stone);}

.review-backdrop{position:fixed;inset:0;background:rgba(26,18,8,0.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;}
.review-backdrop.open{display:flex;}
.review-panel{background:var(--white);border-radius:18px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 24px 64px rgba(26,18,8,0.3);}
.review-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.review-title{font-family:'Archivo Black',sans-serif;font-size:22px;}
.review-close{background:none;border:none;color:var(--stone);cursor:pointer;padding:4px;}
.review-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.review-photo-box{text-align:center;}
.review-photo-box img{width:100%;height:150px;object-fit:cover;border-radius:10px;border:1.5px solid var(--stone-light);cursor:zoom-in;}
.review-photo-label{font-size:12px;color:var(--stone);margin-top:6px;font-weight:600;}
.review-detail-row{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--card);}
.review-detail-row span:first-child{color:var(--stone);}
.review-detail-row span:last-child{font-weight:600;}
.review-actions{display:flex;gap:10px;margin-top:22px;}
.btn-approve{flex:1;background:var(--green);color:#fff;border:none;padding:13px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;}
.btn-reject{flex:1;background:var(--red-light);color:var(--red);border:1.5px solid var(--red);padding:13px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;}
.btn-approve:disabled,.btn-reject:disabled{opacity:0.5;cursor:not-allowed;}

.photo-zoom-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:3000;display:none;align-items:center;justify-content:center;padding:30px;}
.photo-zoom-backdrop.open{display:flex;}
.photo-zoom-backdrop img{max-width:100%;max-height:100%;border-radius:8px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:var(--cream);padding:13px 22px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:all 0.3s;z-index:4000;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--red);}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Young<span>Merit</span></a>
  <div class="nav-right">
    <a href="profile.html" class="back-link">&larr; Back to Profile</a>
  </div>
</nav>

<div id="gateMsg" class="gate-msg" style="display:none;"></div>

<div class="page-wrap" id="pageContent" style="display:none;">
  <div class="page-title">VERIFICATION REVIEW</div>
  <div class="page-sub">Pending identity verification submissions awaiting a decision.</div>
  <div class="queue-list" id="queueList"><div class="empty-state">Loading…</div></div>
</div>

<div class="review-backdrop" id="reviewBackdrop" onclick="if(event.target===this)closeReview()">
  <div class="review-panel">
    <div class="review-header">
      <div>
        <div class="review-title" id="reviewName"></div>
        <div style="font-size:13px;color:var(--stone);margin-top:2px;" id="reviewMeta"></div>
      </div>
      <button class="review-close" onclick="closeReview()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="review-photos" id="reviewPhotos"></div>
    <div class="review-detail-row"><span>Document type</span><span id="reviewDocType"></span></div>
    <div class="review-detail-row"><span>Submitted</span><span id="reviewSubmitted"></span></div>
    <div class="review-actions">
      <button class="btn-reject" id="rejectBtn" onclick="decideReview('rejected')">Reject</button>
      <button class="btn-approve" id="approveBtn" onclick="decideReview('approved')">Approve</button>
    </div>
  </div>
</div>

<div class="photo-zoom-backdrop" id="photoZoomBackdrop" onclick="closePhotoZoom()">
  <img id="photoZoomImg" src=""/>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(msg,type){var tEl=document.getElementById('toast');tEl.textContent=msg;tEl.className='toast'+(type==='error'?' error':'');setTimeout(function(){tEl.classList.add('show');},10);setTimeout(function(){tEl.classList.remove('show');},2800);}

var U = null;
try { U = JSON.parse(localStorage.getItem('growiq_user')); } catch(e) {}

if(!U || !U.loggedIn){
  document.getElementById('gateMsg').innerHTML = '<p>You need to be signed in to view this page.</p>';
  document.getElementById('gateMsg').style.display = 'block';
  setTimeout(function(){ window.location.href = 'auth.html'; }, 1200);
}

var queueCache = [];

async function initAdminReview(){
  if(!U || !U.supabaseId){ return; }
  try {
    var profRes = await ymSupabaseClient.from('profiles').select('is_admin').eq('id', U.supabaseId).single();
    if(!profRes.data || !profRes.data.is_admin){
      document.getElementById('gateMsg').innerHTML = '<p>You don\'t have access to this page.</p>';
      document.getElementById('gateMsg').style.display = 'block';
      return;
    }
    document.getElementById('pageContent').style.display = 'block';
    await loadQueue();
  } catch(err){
    console.error('YoungMerit: failed to check admin access', err);
    document.getElementById('gateMsg').innerHTML = '<p>Something went wrong. Please try again.</p>';
    document.getElementById('gateMsg').style.display = 'block';
  }
}

async function loadQueue(){
  var listEl = document.getElementById('queueList');
  try {
    var res = await ymSupabaseClient.from('identity_verifications')
      .select('id, user_id, document_type, submitted_at, profiles(first_name, last_name, business_name)')
      .eq('status', 'pending')
      .order('submitted_at', { ascending: true });
    if(res.error) throw res.error;
    queueCache = res.data || [];

    if(!queueCache.length){
      listEl.innerHTML = '<div class="empty-state">No pending submissions right now.</div>';
      return;
    }

    listEl.innerHTML = queueCache.map(function(row, i){
      var p = row.profiles || {};
      var name = p.business_name || ((p.first_name||'')+' '+(p.last_name||'')).trim() || 'Unknown';
      var initial = name.charAt(0).toUpperCase();
      var docLabels = { national_id: 'National ID', passport: 'Passport', drivers_license: "Driver's Licence" };
      var when = new Date(row.submitted_at).toLocaleDateString();
      return '<div class="queue-row" onclick="openReview('+i+')">' +
        '<div class="queue-avatar">'+initial+'</div>' +
        '<div class="queue-info"><div class="queue-name">'+escHtml(name)+'</div><div class="queue-meta">'+docLabels[row.document_type]+' &middot; Submitted '+when+'</div></div>' +
        '<span class="queue-badge pending">Pending</span>' +
      '</div>';
    }).join('');
  } catch(err){
    console.error('YoungMerit: failed to load verification queue', err);
    listEl.innerHTML = '<div class="empty-state">Something went wrong loading the queue.</div>';
  }
}

function escHtml(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

var activeReview = null;

async function openReview(index){
  var row = queueCache[index];
  activeReview = row;
  var p = row.profiles || {};
  var name = p.business_name || ((p.first_name||'')+' '+(p.last_name||'')).trim() || 'Unknown';
  var docLabels = { national_id: 'National ID', passport: 'Passport', drivers_license: "Driver's Licence" };

  document.getElementById('reviewName').textContent = name;
  document.getElementById('reviewMeta').textContent = docLabels[row.document_type];
  document.getElementById('reviewDocType').textContent = docLabels[row.document_type];
  document.getElementById('reviewSubmitted').textContent = new Date(row.submitted_at).toLocaleString();
  document.getElementById('reviewPhotos').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--stone);padding:20px;">Loading photos…</div>';
  document.getElementById('approveBtn').disabled = false;
  document.getElementById('rejectBtn').disabled = false;
  document.getElementById('reviewBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    var fullRes = await ymSupabaseClient.from('identity_verifications').select('document_front_url, document_back_url, selfie_url').eq('id', row.id).single();
    if(fullRes.error) throw fullRes.error;
    var paths = { front: fullRes.data.document_front_url, back: fullRes.data.document_back_url, selfie: fullRes.data.selfie_url };
    var labels = { front: 'Document (front)', back: 'Document (back)', selfie: 'Selfie' };

    var photosHtml = '';
    for(var key in paths){
      if(!paths[key]) continue;
      var signRes = await ymSupabaseClient.storage.from('identity-documents').createSignedUrl(paths[key], 300);
      var url = signRes.data ? signRes.data.signedUrl : '';
      photosHtml += '<div class="review-photo-box"><img src="'+url+'" onclick="openPhotoZoom(\''+url.replace(/'/g,"\\'")+'\')"/><div class="review-photo-label">'+labels[key]+'</div></div>';
    }
    document.getElementById('reviewPhotos').innerHTML = photosHtml;
  } catch(err){
    console.error('YoungMerit: failed to load verification photos', err);
    document.getElementById('reviewPhotos').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--red);padding:20px;">Failed to load photos.</div>';
  }
}

function closeReview(){
  document.getElementById('reviewBackdrop').classList.remove('open');
  document.body.style.overflow = '';
  activeReview = null;
}

function openPhotoZoom(url){
  document.getElementById('photoZoomImg').src = url;
  document.getElementById('photoZoomBackdrop').classList.add('open');
}
function closePhotoZoom(){
  document.getElementById('photoZoomBackdrop').classList.remove('open');
}

async function decideReview(decision){
  if(!activeReview) return;
  var approveBtn = document.getElementById('approveBtn');
  var rejectBtn = document.getElementById('rejectBtn');
  approveBtn.disabled = true; rejectBtn.disabled = true;

  var reason = null;
  if(decision === 'rejected'){
    reason = prompt('Reason for rejecting this submission (shown to the applicant):');
    if(reason === null){ approveBtn.disabled = false; rejectBtn.disabled = false; return; }
  }

  try {
    var updates = { status: decision, reviewed_at: new Date().toISOString() };
    if(reason) updates.rejection_reason = reason;
    var res = await ymSupabaseClient.from('identity_verifications').update(updates).eq('id', activeReview.id);
    if(res.error) throw res.error;
    toast(decision === 'approved' ? 'Verification approved.' : 'Verification rejected.', decision === 'approved' ? 'ok' : 'error');
    closeReview();
    await loadQueue();
  } catch(err){
    console.error('YoungMerit: failed to submit review decision', err);
    toast('Something went wrong. Please try again.', 'error');
    approveBtn.disabled = false; rejectBtn.disabled = false;
  }
}
</script>

</body>
</html>
